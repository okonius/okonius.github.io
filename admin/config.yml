backend:
  name: github
  repo: okonius/okonius.github.io
  branch: main
  app_id: Ov23liJthKvJSumcOEQo

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "home"
    label: "home"
    files:
      - label: "posts"
        name: "posts"
        file: "data/posts.json"
        fields:
          - label: "items"
            name: "items"
            widget: "list"
            fields:
              - { label: "title", name: "title", widget: "string" }
              - { label: "desc", name: "desc", widget: "text" }
              - { label: "url", name: "url", widget: "string", required: false }

  - name: "useful_things"
    label: "useful things"
    files:
      - label: "links"
        name: "links"
        file: "data/links.json"
        fields:
          - label: "items"
            name: "items"
            widget: "list"
            fields:
              - { label: "title", name: "title", widget: "string" }
              - { label: "desc", name: "desc", widget: "text" }
              - { label: "url", name: "url", widget: "string" }

  - name: "projects"
    label: "projects"
    files:
      - label: "projects"
        name: "projects"
        file: "data/projects.json"
        fields:
          - label: "items"
            name: "items"
            widget: "list"
            fields:
              - { label: "title", name: "title", widget: "string" }
              - { label: "desc", name: "desc", widget: "text" }
              - { label: "url", name: "url", widget: "string", required: false }
              - { label: "is_wip", name: "is_wip", widget: "boolean", default: false }